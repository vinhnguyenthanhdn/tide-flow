name: Question
description: Ask about the model, code, or contribution process.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to ask. Please check the README and model notes first.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Share relevant links, screenshots, data sources, or code.
