version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tooling:
        patterns:
          - "@playwright/*"
          - "@vitest/*"
          - "jsdom"
          - "serve"
          - "vitest"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
