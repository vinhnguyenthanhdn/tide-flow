<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Tide Flow VN social preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1280px;
      height: 640px;
      margin: 0;
      overflow: hidden;
      color: #f8fafc;
      background:
        radial-gradient(circle at 80% 15%, rgb(14 165 233 / 22%), transparent 34%),
        linear-gradient(145deg, #020817 0%, #071426 58%, #0f172a 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { position: relative; height: 100%; padding: 72px 80px; }
    .eyebrow {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 9px 14px;
      border: 1px solid #1e3a5f;
      border-radius: 999px;
      color: #7dd3fc;
      background: rgb(15 23 42 / 72%);
      font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
    }
    h1 { margin: 34px 0 12px; font-size: 76px; line-height: 1; letter-spacing: -.045em; }
    h1 span { color: #38bdf8; }
    p { width: 770px; margin: 0; color: #cbd5e1; font-size: 28px; line-height: 1.35; }
    .meta { margin-top: 34px; color: #94a3b8; font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
    svg { position: absolute; right: 0; bottom: 0; width: 720px; height: 350px; }
    .grid { stroke: #1e293b; stroke-width: 1; }
    .area { fill: url(#area); }
    .wave { fill: none; stroke: #0ea5e9; stroke-width: 7; stroke-linecap: round; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">[ ~ ] OPEN SOURCE · MIT</div>
    <h1>Tide Flow <span>VN</span></h1>
    <p>Explore how harmonic constituents combine into tidal patterns across coastal Vietnam.</p>
    <div class="meta">12 LOCATIONS · BROWSER-BASED · CONTRIBUTIONS WELCOME</div>
    <svg viewBox="0 0 720 350" aria-hidden="true">
      <defs>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0ea5e9" stop-opacity=".34" />
          <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path class="grid" d="M0 70H720M0 140H720M0 210H720M0 280H720M90 0V350M180 0V350M270 0V350M360 0V350M450 0V350M540 0V350M630 0V350" />
      <path class="area" d="M0 220 C55 80 95 90 145 220 S240 350 292 188 S385 54 434 208 S530 340 580 166 S670 80 720 190 V350 H0Z" />
      <path class="wave" d="M0 220 C55 80 95 90 145 220 S240 350 292 188 S385 54 434 208 S530 340 580 166 S670 80 720 190" />
    </svg>
  </main>
</body>
</html>
